# ---------- Play 1: create AWS resources + in-memory groups ----------
- name: Provision EC2
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/machine-info.yaml
  environment:
    AWS_PROFILE: "{{ aws_profile }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
  tasks:
    - name: Upload your public key to AWS
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        key_material: "{{ lookup('file', ssh_public_key) }}"

    - name: Create security group
      amazon.aws.ec2_group:
        name: "{{ sg_name }}"
        description: "SSH and k8s node traffic"
        rules:
          - proto: tcp
            ports: [22]
            cidr_ip: "{{ ssh_cidr }}"
      register: sg

    - name: Allow all traffic between nodes in the group
      amazon.aws.ec2_group:
        name: "{{ sg_name }}"
        description: "SSH and k8s node traffic"
        rules:
          - proto: tcp
            ports: [22]
            cidr_ip: "{{ ssh_cidr }}"
          - proto: all
            group_id: "{{ sg.group_id }}"

    - name: Find Ubuntu 24.04 AMIs
      amazon.aws.ec2_ami_info:
        owners: ["{{ ubuntu_specs.v24.image_owner }}"]
        filters:
          name: "{{ ubuntu_specs.v24.image_name }}"
          architecture: x86_64
      register: ami

    - name: Pick newest AMI
      ansible.builtin.set_fact:
        ami_id: "{{ (ami.images | sort(attribute='creation_date') | last).image_id }}"

    - name: Create instances
      amazon.aws.ec2_instance:
        name: "{{ item.name }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ item.instance_type }}"
        image_id: "{{ ami_id }}"
        security_group: "{{ sg.group_id }}"
        network:
          assign_public_ip: true
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: "{{ item.disk_size }}"
              volume_type: "{{ item.disk_type }}"
              delete_on_termination: true
        wait: true
        state: running
      loop: "{{ machines_info }}"
      loop_control:
        label: "{{ item.name }}"
      register: ec2_instances

    - name: Get running instances with their IPs
      amazon.aws.ec2_instance_info:
        filters:
          "tag:Name": "{{ machines_info | map(attribute='name') | list }}"
          instance-state-name: running
      register: running

    - name: Build in-memory groups (masters, workers, k8s)
      ansible.builtin.add_host:
        name: "{{ item.tags.Name }}"
        groups: "{{ ['masters', 'k8s'] if item.tags.Name == 'master' else ['workers', 'k8s'] }}"
        ansible_connection: ssh
        ansible_host: "{{ item.public_ip_address }}"
        private_ip: "{{ item.private_ip_address }}"
        ansible_user: "{{ node_user }}"
        ansible_ssh_private_key_file: "{{ ssh_private_key }}"
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ running.instances }}"
      loop_control:
        label: "{{ item.tags.Name }}"

    - name: Save raw EC2 result (for debugging)
      ansible.builtin.copy:
        content: "{{ ec2_instances | to_nice_json }}"
        dest: "{{ playbook_dir }}/ec2_instances.json"
        mode: "0644"

    - name: Write inventory.ini for later manual use
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../template/instance.j2"
        dest: "{{ playbook_dir }}/../inventory.ini"
        mode: "0644"

# ---------- Play 2: your vagrant key -> all 4 machines ----------
- name: Put vagrant public key on master, node1, node2, node3
  hosts: k8s
  gather_facts: false
  vars_files:
    - ../vars/machine-info.yaml
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

    - name: Authorize vagrant public key
      ansible.posix.authorized_key:
        user: "{{ node_user }}"
        state: present
        key: "{{ lookup('file', ssh_public_key) }}"

# ---------- Play 3: ssh-keygen on master ----------
- name: Generate keypair on master
  hosts: masters
  gather_facts: false
  vars_files:
    - ../vars/machine-info.yaml
  tasks:
    - name: Run ssh-keygen on master
      ansible.builtin.command: >
        ssh-keygen -t ed25519 -N "" -C "master@k8s"
        -f /home/{{ node_user }}/.ssh/id_ed25519
      args:
        creates: "/home/{{ node_user }}/.ssh/id_ed25519"

    - name: Slurp master public key
      ansible.builtin.slurp:
        src: "/home/{{ node_user }}/.ssh/id_ed25519.pub"
      register: master_pubkey

# ---------- Play 4: master key -> node1, node2, node3 ----------
- name: Put master public key on node1, node2, node3
  hosts: workers
  gather_facts: false
  vars_files:
    - ../vars/machine-info.yaml
  tasks:
    - name: Authorize master public key
      ansible.posix.authorized_key:
        user: "{{ node_user }}"
        state: present
        key: "{{ hostvars[groups['masters'][0]].master_pubkey.content | b64decode }}"

# ---------- Play 2b: set hostnames ----------
- name: Set hostname to master / node1 / node2 / node3
  hosts: k8s
  gather_facts: false
  become: true
  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
        use: systemd

    - name: Add all nodes to /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} K8S NODES"
        block: |
          {% for h in groups['k8s'] %}
          {{ hostvars[h].private_ip }} {{ h }}
          {% endfor %}
