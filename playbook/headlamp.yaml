---
- name: Install Headlamp on Kubernetes Cluster
  hosts: masters
  become: false
  vars_files:
    - ../vars/machine-info.yaml
  
  vars:
    headlamp_host: headlamp.kdey.me
    manifest_dir: "/home/{{ node_user }}"
    kubeconfig_path: "/home/{{ node_user }}/.kube/config"  
  
  tasks:
    - name: Add Headlamp Helm repository
      ansible.builtin.command:
        cmd: helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/ --force-update
      changed_when: false

    - name: Update Helm repositories
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false

    - name: Install or upgrade Headlamp
      ansible.builtin.command:
        cmd: helm upgrade --install headlamp headlamp/headlamp -n headlamp --create-namespace

    - name: Create prod-clusterissuer.yaml
      ansible.builtin.copy:
        dest: "{{ manifest_dir }}/prod-clusterissuer.yaml"
        mode: "0644"
        content: |
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-prod
          spec:
            acme:
              email: kdeylester@gmail.com
              server: https://acme-v02.api.letsencrypt.org/directory
              privateKeySecretRef:
                name: letsencrypt-prod
              solvers:
                - http01:
                    ingress:
                      ingressClassName: traefik

    - name: Create headlamp-ingress.yaml
      ansible.builtin.copy:
        dest: "{{ manifest_dir }}/headlamp-ingress.yaml"
        mode: "0644"
        content: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: headlamp
            namespace: headlamp
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
          spec:
            ingressClassName: traefik
            tls:
              - hosts:
                  - {{ headlamp_host }}
                secretName: headlamp-tls-cert
            rules:
              - host: {{ headlamp_host }}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: headlamp
                          port:
                            number: 80

    - name: Apply ClusterIssuer
      ansible.builtin.command:
        cmd: kubectl apply -f {{ manifest_dir }}/prod-clusterissuer.yaml

    - name: Apply Ingress for Headlamp
      ansible.builtin.command:
        cmd: kubectl apply -f {{ manifest_dir }}/headlamp-ingress.yaml
